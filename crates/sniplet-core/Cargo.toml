[package]
name = "sniplet-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.25"
