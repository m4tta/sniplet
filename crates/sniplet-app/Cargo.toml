[package]
name = "sniplet-app"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Sniplet, a precise cross-platform screenshot editor"

[[bin]]
name = "sniplet"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a `dev` revision (dev is never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "1c10c5c26b8fc95c1ce359de366aee87c9faa527", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1c10c5c26b8fc95c1ce359de366aee87c9faa527" }
sniplet-core = { path = "../sniplet-core" }
sniplet-platform = { path = "../sniplet-platform" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
anyhow = "1"
global-hotkey = "0.8"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
serde_json = "1"
resvg = { version = "0.45.1", default-features = false }

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSCursor", "NSEvent", "NSGraphics", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSAppleEventDescriptor", "NSAppleEventManager", "NSDictionary", "NSString", "NSValue"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[dev-dependencies]
qrcode = "0.14"
tempfile = "3"
