[package]
name = "sniplet-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
sniplet-core = { path = "../sniplet-core" }
arboard = "3.6"
directories = "6"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rqrr = "0.10"
s3 = { version = "0.1.36", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
xcap = "=0.9.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
qrcode = "0.14"
