[package]
name = "sniplet-platform"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
sha2 = "0.10"
self_update = { version = "=1.3.2", default-features = false, features = ["ureq", "rustls", "archive-zip", "compression-zip-deflate", "archive-tar", "compression-tar-gz"] }
sniplet-core = { path = "../sniplet-core" }
arboard = "3.6"
directories = "6"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
rqrr = "0.10"
s3 = { version = "0.1.36", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
xcap = "=0.9.8"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
wallpaper = { version = "3.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(windows)'.dependencies]
self-replace = "1"
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
qrcode = "0.14"
zip = { version = "9", default-features = false, features = ["deflate"] }
