<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui)}.top,.controls,.presets{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between;padding:6px 0 14px;padding-right:80px}.name{font-weight:500;letter-spacing:.12em}.meta,.hint{color:var(--muted-foreground);font-size:12px}.stage{position:relative;height:430px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.stamp{position:absolute;left:12px;top:12px;pointer-events:none;color:var(--muted-foreground);font:11px var(--font-mono,monospace);letter-spacing:.1em}.hint{margin:12px 0 16px}.controls{gap:16px;justify-content:space-between}button,select{font:inherit;font-size:12px;min-height:36px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--secondary);color:var(--secondary-foreground);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}button:hover{filter:brightness(1.1)}.slider{display:flex;gap:10px;align-items:center;font-size:12px}.slider input{width:110px;accent-color:var(--primary)}output{font-variant-numeric:tabular-nums;min-width:28px}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font:11px var(--font-mono,monospace);color:var(--muted-foreground)}@media(max-width:480px){.stage{height:360px}.controls{gap:12px}.presets{gap:6px}button{min-height:44px;padding:8px 10px}.top{padding-right:0}.slider input{width:100px}}
</style></head><body><main id="gravity-lab">
<div class="top"><span class="name">ORBIT / LAB</span><span class="meta">3,000 particles · one tiny universe</span></div>
<div class="stage"><canvas aria-label="Interactive gravity simulation. Drag the numbered gravity wells, or tap empty space to move the first well. Presets and the gravity slider are also available below." role="img"></canvas><span class="stamp">LIVE GRAVITY FIELD</span></div>
<p class="hint">Drag a gravity well. Tap the void to bend space.</p>
<div class="controls"><div class="presets" aria-label="Orbital presets"><button data-mode="galaxy" aria-pressed="true">Spiral galaxy</button><button data-mode="binary" aria-pressed="false">Binary stars</button><button data-mode="storm" aria-pressed="false">Chaos engine</button></div><label class="slider">Gravity <input type="range" min="20" max="180" value="85" aria-label="Gravity strength"><output>0.85×</output></label></div>
<div class="controls" style="margin-top:14px"><div class="presets"><button id="burst">Shockwave</button><button id="pause" aria-pressed="false">Pause</button></div><span class="meta" id="status" aria-live="polite">Spiral galaxy</span></div>
<div class="bottom"><span>REAL-TIME · PARTICLE TOY</span><span>DRAG / WARP / REPEAT</span></div>
</main><script>
(()=>{
const root=document.getElementById('gravity-lab'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),range=root.querySelector('input'),out=root.querySelector('output'),status=root.querySelector('#status'),pause=root.querySelector('#pause');
const N=3000,particles=[],wells=[];let w=1,h=1,dpr=1,mode='galaxy',gravity=.85,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,drag=-1,last=0,colors=[],bg='',fg='',border='',pulse=0;
function color(token){const el=document.createElement('span');el.style.color='var('+token+')';root.append(el);const v=getComputedStyle(el).color;el.remove();return v}
function theme(){bg=color('--background');fg=color('--foreground');border=color('--border');colors=[1,2,3].map(i=>color('--chart-'+i));clear()}
function clear(){ctx.globalAlpha=1;ctx.fillStyle=bg;ctx.fillRect(0,0,w,h)}
function seed(){particles.length=0;wells.length=0;let layouts=mode==='binary'?[[.34,.5],[.66,.5]]:mode==='storm'?[[.3,.35],[.7,.4],[.5,.72]]:[[.5,.5]];layouts.forEach(([x,y])=>wells.push({x:x*w,y:y*h}));const scale=Math.min(w,h);for(let i=0;i<N;i++){let k=i%wells.length,well=wells[k],a=Math.random()*Math.PI*2,r=(.04+Math.pow(Math.random(),.65)*.39)*scale;let speed=Math.sqrt(75*gravity/(r/scale+.06))*.16;particles.push({x:well.x+Math.cos(a)*r,y:well.y+Math.sin(a)*r,vx:-Math.sin(a)*speed,vy:Math.cos(a)*speed,c:k%3,life:Math.random()*1500});}pulse=0;clear();draw(0)}
function resize(){let box=canvas.getBoundingClientRect();w=box.width;h=box.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);seed()}
function draw(dt){ctx.globalAlpha=.12;ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.globalAlpha=1;const scale=Math.min(w,h)/430;
for(let p of particles){let x=p.x,y=p.y;if(dt){for(let well of wells){let dx=well.x-p.x,dy=well.y-p.y,r2=dx*dx+dy*dy+180*scale*scale,f=gravity*150*scale/(r2*Math.sqrt(r2));p.vx+=dx*f*dt;p.vy+=dy*f*dt;}p.vx*=Math.pow(.9995,dt);p.vy*=Math.pow(.9995,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.life+=dt;
if(p.x < -w*.5||p.x>w*1.5||p.y< -h||p.y>h*2||p.life>2000){let well=wells[Math.floor(Math.random()*wells.length)],a=Math.random()*6.283,r=(.1+Math.random()*.4)*Math.min(w,h);p.x=well.x+Math.cos(a)*r;p.y=well.y+Math.sin(a)*r;let v=Math.sqrt(gravity*150*scale/r);p.vx=-Math.sin(a)*v;p.vy=Math.cos(a)*v;p.life=0;x=p.x;y=p.y;}}
ctx.strokeStyle=colors[p.c];ctx.globalAlpha=.5;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(p.x+.45,p.y+.45);ctx.stroke();}
ctx.globalAlpha=1;for(let i=0;i<wells.length;i++){let q=wells[i];let halo=ctx.createRadialGradient(q.x,q.y,1,q.x,q.y,35);halo.addColorStop(0,colors[i%3]);halo.addColorStop(1,'transparent');ctx.globalAlpha=.17;ctx.fillStyle=halo;ctx.fillRect(q.x-35,q.y-35,70,70);ctx.globalAlpha=1;ctx.strokeStyle=fg;ctx.lineWidth=1;ctx.beginPath();ctx.arc(q.x,q.y,10,0,Math.PI*2);ctx.stroke();ctx.fillStyle=fg;ctx.beginPath();ctx.arc(q.x,q.y,2,0,Math.PI*2);ctx.fill();ctx.font='11px system-ui';ctx.fillText(String(i+1),q.x+16,q.y-12);}
if(pulse>0){ctx.globalAlpha=pulse;ctx.strokeStyle=fg;ctx.lineWidth=1;ctx.beginPath();ctx.arc(w/2,h/2,(1-pulse)*Math.max(w,h),0,7);ctx.stroke();ctx.globalAlpha=1;if(dt)pulse=Math.max(0,pulse-.018*dt);}}
function frame(t){let dt=Math.min((t-last)/16.667,2);last=t;if(!paused&&document.visibilityState!=='hidden')draw(dt);requestAnimationFrame(frame)}
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;root.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status.textContent=b.textContent;seed()});
range.oninput=()=>{gravity=Number(range.value)/100;out.textContent=gravity.toFixed(2)+'×'};
function pauseUI(){pause.textContent=paused?'Play':'Pause';pause.setAttribute('aria-pressed',String(paused))}pause.onclick=()=>{paused=!paused;pauseUI();status.textContent=paused?'Time suspended':'Simulation running'};pauseUI();
root.querySelector('#burst').onclick=()=>{for(let p of particles){let dx=p.x-w/2,dy=p.y-h/2,r=Math.hypot(dx,dy)||1;p.vx+=dx/r*2.5;p.vy+=dy/r*2.5;}pulse=1;status.textContent='Shockwave released';if(paused)draw(1)};
function point(e){let r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.onpointerdown=e=>{let p=point(e),best=Infinity;wells.forEach((q,i)=>{let d=Math.hypot(q.x-p.x,q.y-p.y);if(d<best){best=d;drag=i}});if(best>50)drag=0;wells[drag]=p;canvas.setPointerCapture(e.pointerId);if(paused){clear();draw(0)}};
canvas.onpointermove=e=>{if(drag<0)return;let p=point(e);wells[drag]={x:Math.max(12,Math.min(w-12,p.x)),y:Math.max(12,Math.min(h-12,p.y))};if(paused){clear();draw(0)}};
canvas.onpointerup=()=>{drag=-1};canvas.onpointercancel=()=>{drag=-1};new ResizeObserver(resize).observe(canvas);new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['style','class','data-theme']});theme();resize();for(let i=0;i<35;i++)draw(1);requestAnimationFrame(frame);
console.assert(particles.length===3000,'Particle count');console.assert(wells.length===1,'Initial gravity well');console.log('Orbit Lab ready: 3,000 particles, three presets, drag gravity, shockwave, pause, reduced motion.');
})();
</script></body></html>
