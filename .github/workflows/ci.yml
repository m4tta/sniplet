name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (platform independent)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify sniplet-core independently
        run: bash scripts/verify.sh core

  native:
    name: ${{ matrix.name }} workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc g++ clang cmake pkg-config libclang-dev \
            libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libegl-dev libgbm-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Verify workspace and UI test feature
        if: runner.os != 'Windows'
        run: bash scripts/verify.sh all

      - name: Verify workspace and UI test feature
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1 -Suite all
