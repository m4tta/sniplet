name: Build Nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or full commit SHA to build
        type: string
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: sniplet-nightly-${{ inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release scripts
        run: python -m unittest discover -s scripts -p 'test_release.py'
      - name: Resolve version and commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py prepare
      - name: Report release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BUILD: ${{ steps.release.outputs.build }}
        run: |
          printf 'Nightly tag: `%s`\n\nBuild required: `%s`\n' "$TAG" "$BUILD" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc g++ clang cmake pkg-config libclang-dev \
            libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libegl-dev libgbm-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - name: Check Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Check format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check code
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build application
        run: cargo build -p sniplet-app --release --locked
      - name: Package application
        env:
          TARGET: ${{ matrix.target }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SNIPLET_SIGNING_IDENTITY: '-'
        run: python scripts/release.py package "$TARGET" --sha "$SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.target }}
          path: dist-release/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: sniplet-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          path: dist-release/assets
          merge-multiple: true
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: python scripts/release.py publish-nightly --sha "$SHA"
      - name: Report download link
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: printf '[Download nightly](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
