name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version change
        type: choice
        options: [patch, minor, major, set]
        default: patch
        required: true
      version:
        description: Exact version when using set (for example 0.2.0)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sniplet-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release scripts
        run: python -m unittest discover -s scripts -p 'test_release.py'
      - name: Set version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release.py bump "$BUMP" --version "$VERSION"
      - name: Commit version to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main
          printf 'Version is now `%s`. Run **Build Nightly** when ready.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
