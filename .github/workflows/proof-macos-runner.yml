name: Proof macOS runner (temporary)

# Temporary proof for the macos-26 release runner. Delete before merge.
# Builds and packages the Mac targets like release.yml, without publishing,
# then runs the macOS 26 build on a macOS 15 runner.
on:
  pull_request:
    paths:
      - '.github/workflows/proof-macos-runner.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SNIPLET_VERSION: 0.0.1
      SNIPLET_BUILD_SHA: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      SNIPLET_SIGNING_IDENTITY: '-'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
          - target: macos-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Show runner and SDK
        run: sw_vers; xcodebuild -version; xcrun --show-sdk-version
      - name: Check Metal compiler
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Confirm the linker warning text the build check looks for
        run: |
          cd "$RUNNER_TEMP"
          echo 'int main(void){return 0;}' > control.c
          clang -c -mmacosx-version-min=26.0 control.c -o control.o
          clang -mmacosx-version-min=15.0 control.o -o control 2>&1 | tee control.log
          grep -i "built for newer" control.log
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Build application
        env:
          # rustc hides deployment mismatch warnings under the allow-by-default linker-info lint.
          RUSTFLAGS: -Wlinker-info
        run: |
          cargo build -p sniplet-app --release --locked 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" -eq 0
          if grep -i "built for newer" "$RUNNER_TEMP/build.log"; then
            echo "::error::An object targets a macOS version above 15.0"
            exit 1
          fi
      - name: Package application
        run: python scripts/release.py package "${{ matrix.target }}" --version "$SNIPLET_VERSION" --sha "$SNIPLET_BUILD_SHA"
      - name: Show minimum macOS version
        run: |
          vtool -show-build dist-release/Sniplet.app/Contents/MacOS/Sniplet | tee "$RUNNER_TEMP/vtool.txt"
          grep -E "minos 15\.0$" "$RUNNER_TEMP/vtool.txt"
          ls -l dist-release/assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-${{ matrix.target }}
          path: dist-release/assets/*
          if-no-files-found: error
          retention-days: 1

  run-on-macos-15:
    name: Run macOS 26 build on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-macos-arm64
          path: assets
      - name: Start the app
        run: |
          sw_vers
          ls -l assets
          ditto -x -k assets/*.zip app
          app/Sniplet.app/Contents/MacOS/Sniplet --build-info
