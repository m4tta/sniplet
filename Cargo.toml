[workspace]
members = ["crates/sniplet-core", "crates/sniplet-platform", "crates/sniplet-app"]
default-members = ["crates/sniplet-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[profile.dev]
debug = 0

# Full-display pixel conversion must stay responsive in the debug desktop app.
[profile.dev.package.sniplet-app]
opt-level = 2

[profile.dev.package.sniplet-core]
opt-level = 2

[profile.dev.package.sniplet-platform]
opt-level = 2

[profile.dev.package.xcap]
opt-level = 2

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
